<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面走丢了 · 青砺公益青岛工作站</title>
<link rel="icon" type="image/png" sizes="32x32" href="/youthpowerqd/assets/brand/favicon-32.png" />
<style>
  :root{--ink:#17130F;--muted:#8B8173;--paper:#FAF7F1;--red:#B93B2E;--line:#E5DCCD}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);
       color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:24px}
  .card{max-width:520px;text-align:center}
  .code{font-family:Georgia,serif;font-size:96px;line-height:1;margin:0;letter-spacing:-.03em}
  h1{font-size:22px;margin:18px 0 10px;font-weight:700}
  p{color:var(--muted);line-height:1.9;margin:0 0 26px;font-size:14px}
  a.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--ink);
        color:var(--paper);text-decoration:none;font-size:14px;font-weight:600}
  a.btn:hover{background:var(--red)}
  .foot{margin-top:26px;font-size:12px;color:#B3A794;font-family:ui-monospace,Consolas,monospace;
        letter-spacing:.16em}
  img{width:34px;height:34px;object-fit:contain;margin-bottom:10px}
</style>
</head>
<body>
  <div class="card">
    <img src="/youthpowerqd/assets/brand/logo-mark.png" alt="" />
    <p class="code">404</p>
    <h1>这个页面走丢了</h1>
    <p>链接可能少了个字符，或者这一页还没做。<br />回到首页看看大家吧。</p>
    <a class="btn" href="/youthpowerqd/">回到首页 →</a>
    <div class="foot">YOUTH POWER QINGDAO · 2026—2027</div>
  </div>
  <script>
    // 3 秒后自动回首页（保留已输入的查询参数，例如 ?open=23）
    setTimeout(function () {
      location.replace("/youthpowerqd/" + location.search);
    }, 3000);
  </script>
</body>
</html>
